spring:
  application:
    name: taskflow-backend
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8080

---
# ---------------------------------------------------------------------------
# dev profile (default) - H2 in-memory database, no external services needed.
# Run with: mvn spring-boot:run  (or just run the app, dev is the default)
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:taskflow;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.taskflow: INFO

---
# ---------------------------------------------------------------------------
# prod profile - PostgreSQL. Documented for reference; not required to run
# the project locally. To actually use it, provide a real Postgres instance
# and start the app with: java -jar app.jar --spring.profiles.active=prod
# (override the placeholders below with real values via env vars).
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD:taskflow}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.taskflow: INFO
